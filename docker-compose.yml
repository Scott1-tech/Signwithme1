# Compose v2: the top-level `version` key is obsolete and is deliberately omitted.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contract_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: contracts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_app -d contracts"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional. The default storage backend is the filesystem, which costs no
  # memory at all; start MinIO only with `--profile s3`.
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?set MINIO_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      # Console only, on the loopback interface. The API reaches MinIO over the
      # compose network, so the S3 port needs no host binding at all.
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    # Migrations run before the API serves, so a fresh `up` has a schema.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://contract_app:${DB_PASSWORD}@postgres:5432/contracts
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /data/storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-contracts}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      DEBUG: ${DEBUG:-false}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      # Loopback only: nginx in the frontend container proxies /api, so the API
      # does not need to be reachable from the network directly.
      - "127.0.0.1:8000:8000"
    volumes:
      - app_storage:/data/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info"]
    environment:
      DATABASE_URL: postgresql+psycopg2://contract_app:${DB_PASSWORD}@postgres:5432/contracts
      REDIS_URL: redis://redis:6379/0
      # The worker is what parses and stores every PDF -- it needs the same
      # object-storage credentials as the API, not just a database URL.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: /data/storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-contracts}
      JWT_SECRET: ${JWT_SECRET}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      # Only the API container migrates; two containers racing alembic on start
      # is how a half-applied schema happens.
      RUN_MIGRATIONS: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_healthy }
    volumes:
      - app_storage:/data/storage

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:80"
    depends_on:
      backend: { condition: service_started }

volumes:
  postgres_data:
  minio_data:
  app_storage:
